name: chat_group
description: "AI群聊模拟器 - 创建AI角色群聊，观察AI自动互动"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0-134.0.dev

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # 网络请求
  dio: ^5.4.0

  # JSON 序列化
  json_annotation: ^4.8.1

  # UI 组件
  flutter_slidable: ^3.1.0

  # 工具
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.0
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
