name: chat_group
description: "AI群聊模拟器 - 创建AI角色群聊，观察AI自动互动"
publish_to: 'none'

version: 1.1.0+1

environment:
  # 兼容本地自定义 fork（Dart 3.6.0-134.0.dev）与 CI 用的 3.24.0 stable（Dart 3.5.0）
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.4

  # 网络请求
  dio: ^5.4.0

  # 媒体选择 / 播放（图片视频附件）
  # 注意：chewie 1.8.x 使用了 Flutter 3.27 才引入的 Color.withValues，
  # 与本项目自定义 fork（3.24.0-1.0.pre.538）不兼容，故锁定在 1.7.x。
  image_picker: ^1.1.2
  video_player: ^2.8.1
  chewie: '>=1.7.0 <1.8.0'

  # 系统分享面板（导出对话 -> 分享）
  share_plus: ^10.0.0

  # JSON 序列化
  json_annotation: ^4.8.1

  # UI 组件
  flutter_slidable: ^3.1.0

  # 工具
  uuid: ^4.3.3
  intl: ^0.19.0
  # 纯 Dart 中文拼音转换；不含 Android/iOS 原生 Gradle 配置，兼容桌面与当前 Flutter fork。
  lpinyin: ^2.0.3

  # TTS 语音合成
  flutter_tts: ^3.8.5
  pasteboard: ^0.5.0
  # 注意：file_picker 9.x+ 的 Android build.gradle 使用了 android.flutter 属性，
  # 这是 Flutter 3.27+ 才引入的 API，与本项目 fork（3.24.0-1.0.pre.538）不兼容。
  # 故锁定在 8.x（最后一个兼容 Flutter 3.24 的大版本）。
  file_picker: '>=8.0.0 <9.0.0'
  desktop_drop: ^0.7.1
  open_filex: ^4.7.0
  archive: ^4.0.9
  # 纯 Dart PDF 文本提取；27.2.5 兼容 Dart 2.17+，避免新版 Flutter SDK 下限。
  # 正式发布前须确认项目满足 Syncfusion Community 或 Commercial 授权条件。
  syncfusion_flutter_pdf: 27.2.5
  # DOCX/XLSX 的 Open XML 解析。
  xml: 6.5.0
  crypto: ^3.0.7
  package_info_plus: ">=8.0.0 <9.0.0"

# ===== 依赖覆盖：强制降级使用 android.flutter 属性（3.27+ API）的传递依赖 =====
# 这些包在 9.x+ 版本更新了 Android build.gradle 使用 android.flutter.compileSdkVersion，
# 但本项目 fork（3.24.0-1.0.pre.538）/ CI（3.24.0）不支持该属性。
dependency_overrides:
  # package_info_plus 9.x+ 的 Android build.gradle 使用 android.flutter 属性（3.27+ API）
  package_info_plus: '>=8.0.0 <9.0.0'
  # wakelock_plus 1.4.0+ 同上，锁定到 1.3.x（要求 package_info_plus <9.0.0，与上方兼容）
  wakelock_plus: '>=1.0.0 <1.4.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/release_templates/
