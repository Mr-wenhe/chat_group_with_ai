plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    // 读取 key.properties；生产 Release 没有完整签名配置时必须失败关闭。
    def keystorePropertiesFile = rootProject.file('key.properties')
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }
    def releaseSigningKeys = ['keyAlias', 'keyPassword', 'storeFile', 'storePassword']
    def hasReleaseSigning = keystorePropertiesFile.exists() &&
        releaseSigningKeys.every {
            keystoreProperties[it]?.toString()?.trim()
        }
    // This escape hatch is intentionally opt-in and process-local. CI's
    // permission verification job sets it explicitly; publishing commands
    // never set it, so a missing production key cannot create a misleading
    // release artifact signed by the debug key.
    def allowDebugSigning =
        System.getenv('ALLOW_DEBUG_SIGNING')?.trim()?.equalsIgnoreCase('true') ||
        project.findProperty('allowDebugSigning')?.toString()?.trim()?.equalsIgnoreCase('true')

    namespace = "com.example.chat_group"
    // desktop_drop 0.7.x requires API 36. A literal keeps this compatible
    // with the Flutter 3.24 fork, which does not expose newer android.flutter
    // Gradle properties used by later plugin releases.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.chat_group"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // record（语音输入）与 audioplayers 插件要求 Android 6.0+（API 23）。
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // 仅当 key.properties 完整时才定义 release 签名配置。
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            } else if (allowDebugSigning) {
                signingConfig = signingConfigs.debug
            } else {
                throw new GradleException(
                    '缺少完整的 Android Release 签名配置。请提供 android/key.properties；' +
                    '仅用于权限校验时才设置 ALLOW_DEBUG_SIGNING=true。'
                )
            }
        }
    }
}

flutter {
    source = "../.."
}
