name: Release

# 混合发布工作流（Hybrid Release）
# ----------------------------------------------------------------------------
# 设计原则：Windows 只能在 CI（Windows Runner）上交叉编译，其余 3 个原生平台开发者
# 本机即可构建。因此：
#
#   • CI（本工作流）：仅构建 **Windows**，并负责「创建 GitHub Release（若不存在）
#                      + 上传 Windows 产物」。Release 一旦创建，本地脚本会把其余
#                      3 个原生平台产物追加上传到【同一个 Release】。
#   • 本地（scripts/publish_local.sh）：构建 **macOS / iOS / Android**，
#                     并以「幂等」方式创建 Release（若 CI 尚未建）+ 上传这 3 个产物。
#
# 无论本地脚本与 CI 哪个先跑，都不会冲突：双方都采用
#   「if ! gh release view <tag>; then gh release create ...; fi」 + 「gh release upload --clobber」
# 的写法，先到者建 Release，后到者只追加。
#
# 触发方式：
#   1) 推送 tag（形如 v1.2.3）自动发布 Windows；
#   2) 在 Actions 页面手动触发（workflow_dispatch），指定版本号。
#
# 产物：最终聚合成一个 GitHub Release 附件，含
#        Windows（CI 构建）+ macOS / iOS / Android（本地构建上传）。
#
# 签名：
#   - Android 生产构建：必须设置 ANDROID_KEYSTORE_BASE64 等 secrets 后签名；
#               只有权限校验任务会显式允许 debug 签名，绝不上传该 APK。
#   - iOS / macOS：本仓库走 GitHub Release 分发（非 App Store），本地构建时
#                   若本机有开发者证书会自动签名，否则产出未签名 .app。
#   详见 README「发布指南」章节中 Secrets 配置说明。
# ----------------------------------------------------------------------------

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（不含 v 前缀，例如 1.1.0）。留空则按 Conventional Commits 自动累加"
        required: false
        default: ""

# 同一时间只允许一个发布流程，避免产物互相覆盖
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # 准备阶段：解析版本号与构建号，供 Windows 构建任务复用
  # ============================================================
  prepare:
    name: 解析版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      build_number: ${{ steps.vars.outputs.build_number }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
            # 文档要求不带 v，但手动触发时也兼容用户填写 v1.2.3，
            # 避免最终生成错误的 vv1.2.3 标签。
            RAW_VERSION="${RAW_VERSION#v}"
          else
            # 由 tag 触发，GITHUB_REF_NAME 形如 v1.2.3
            RAW_VERSION="${GITHUB_REF_NAME#v}"
          fi

          # 手动触发且未填写版本号 -> 依据 Conventional Commits 自动累加
          # 规则：含 feat!/BREAKING -> 主版本+1；含 feat -> 次版本+1；否则修订号+1
          if [ -z "$RAW_VERSION" ]; then
            PREV_TAG=$(git tag --sort=-v:refname | head -n1 || true)
            RAW_VERSION=$(python3 scripts/generate_changelog.py --auto-version --since "${PREV_TAG:-}" --repo .)
            echo "🔢 自动计算版本号: $RAW_VERSION (基准: ${PREV_TAG:-无上一标签})"
          fi

          # 构建号使用运行序号，保证每次发布递增且唯一
          BUILD_NUMBER="${{ github.run_number }}"
          echo "version=$RAW_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=v$RAW_VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Release version: $RAW_VERSION+$BUILD_NUMBER  (tag: v$RAW_VERSION)"

  # ============================================================
  # Windows：在 Windows Runner 上构建桌面应用，并创建/追加 Release
  # ============================================================
  windows:
    name: Build Windows (CI 发布)
    needs: prepare
    # 必须用 windows-2022：该镜像同时预装 VS2019 与 VS2022，兼容当前
    # Flutter 3.27.1 的 Windows CMake 工具链；windows-latest 的镜像变更
    # 可能导致 Flutter 找不到所需的 Visual Studio 实例。
    runs-on: windows-2022
    # 创建 / 上传 Release 需要写权限
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # --generate-notes 需要完整提交历史来对比上一个 Release
          fetch-depth: 0

      # 手动触发时，先创建并推送 tag（CI 才能把产物挂到该 tag 上）
      - name: （手动触发）创建并推送 tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          channel: "stable"
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: 写入版本号到 pubspec.yaml
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          python3 - <<'PY'
          import re, os
          p = "pubspec.yaml"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r'^version: .*', f'version: {os.environ["VERSION"]}+{os.environ["BUILD_NUMBER"]}', s, flags=re.M)
          open(p, "w", encoding="utf-8").write(s)
          PY
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: 构建 Windows
        run: flutter build windows --release
      - name: 打包 Release 目录
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "chat_group-windows-v${{ needs.prepare.outputs.version }}.zip"
      - name: 创建 Release（若不存在）并上传 Windows 产物
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # 幂等：若本地脚本已先建好 Release，这里只追加 Windows 产物
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Release $TAG" \
              --generate-notes \
              --verify-tag
            echo "✅ 已创建 Release $TAG"
          else
            echo "ℹ️ Release $TAG 已存在，直接追加 Windows 产物"
          fi
          gh release upload "$TAG" "chat_group-windows-v${{ needs.prepare.outputs.version }}.zip" --clobber
          echo "🪟 Windows 产物已上传"

  # Android 不是 Windows 发布任务的产物，但其最终 Manifest 必须保留联网
  # 权限；在 Release 流程中构建真实 APK 并检查，而不是只检查源码 Manifest。
  android-permissions:
    name: Verify Android release permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - name: Build verification APK (debug-signed, not publishable)
        env:
          ALLOW_DEBUG_SIGNING: "true"
        run: flutter build apk --release
      - run: bash scripts/verify_android_release_permissions.sh build/app/outputs/flutter-apk/app-release.apk
