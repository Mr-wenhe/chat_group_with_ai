<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITLE--></title>
<style>
:root{
  --bg:#ffffff;
  --bg-side:#f7f8fa;
  --fg:#1f2328;
  --fg-muted:#656d76;
  --fg-faint:#8c959f;
  --accent:#4f46e5;
  --accent-soft:#eef0ff;
  --border:#e4e7eb;
  --border-strong:#d0d7de;
  --code-bg:#f4f5f7;
  --warn-bg:#fff8e6;
  --warn-border:#f0c36d;
  --quote-bg:#f6f8fa;
  --sidebar-w:302px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
  font-size:16px;
  line-height:1.78;
  -webkit-font-smoothing:antialiased;
}

/* ── 侧边栏 ───────────────────────────────── */
#sidebar{
  position:fixed; top:0; left:0; bottom:0;
  width:var(--sidebar-w);
  background:var(--bg-side);
  border-right:1px solid var(--border);
  overflow-y:auto;
  padding:22px 0 40px;
  font-size:14px;
}
#sidebar .brand{
  padding:0 20px 14px;
  border-bottom:1px solid var(--border);
  margin-bottom:12px;
}
#sidebar .brand b{font-size:17px;display:block;letter-spacing:.2px}
#sidebar .brand span{color:var(--fg-faint);font-size:12px}
#TOC{padding:0 10px}
#TOC ul{list-style:none;margin:0;padding:0}
#TOC > ul > li{margin:2px 0}
#TOC > ul > li > a{
  font-weight:700;color:var(--fg);font-size:13.5px;
  letter-spacing:.3px;
}
#TOC > ul > li > ul{margin:4px 0 14px 0;padding-left:0}
#TOC > ul > li > ul > li{margin:0}
#TOC > ul > li > ul > li > a{
  display:block;
  padding:4px 10px 4px 14px;
  color:var(--fg-muted);
  text-decoration:none;
  border-left:2px solid transparent;
  border-radius:0 4px 4px 0;
  line-height:1.5;
}
#TOC > ul > li > ul > li > a:hover{background:#eceef2;color:var(--fg)}
#TOC > ul > li > ul > li > a.active{
  color:var(--accent);background:var(--accent-soft);
  border-left-color:var(--accent);font-weight:600;
}
#TOC > ul > li > ul > li > ul{display:none}
#TOC a{text-decoration:none}
#TOC > ul > li > a{display:block;padding:6px 10px 2px}

/* ── 正文 ─────────────────────────────────── */
#content{
  margin-left:var(--sidebar-w);
  padding:48px 56px 120px;
}
/* 正文列居中，避免宽屏下右侧大片留白 */
#content > *{
  max-width:820px;
  margin-left:auto;
  margin-right:auto;
}
#content > p > em:only-child{margin-left:auto;margin-right:auto}
h1,h2,h3,h4{line-height:1.35;font-weight:700;position:relative}
h1{
  font-size:30px;margin:0 0 8px;
  padding-bottom:14px;border-bottom:2px solid var(--border);
}
h1:not(:first-child){margin-top:64px}
h2{
  font-size:23px;margin:46px 0 14px;
  padding-bottom:8px;border-bottom:1px solid var(--border);
}
h3{font-size:18.5px;margin:34px 0 10px}
h4{font-size:16.5px;margin:26px 0 8px;color:#30363d}
p{margin:13px 0}
a{color:var(--accent)}
strong{font-weight:700;color:#111}

ul,ol{padding-left:26px;margin:13px 0}
li{margin:6px 0}
li > ul,li > ol{margin:6px 0}

hr{border:0;border-top:1px solid var(--border);margin:44px 0}

/* 引用块 = 提示框 */
blockquote{
  margin:18px 0;padding:14px 20px;
  background:var(--quote-bg);
  border-left:4px solid var(--border-strong);
  border-radius:0 6px 6px 0;
  color:#3d444d;
}
blockquote p{margin:8px 0}
blockquote p:first-child{margin-top:0}
blockquote p:last-child{margin-bottom:0}
/* 含 ⚠️ 的引用块换成警示配色（类名由构建脚本打） */
blockquote.warn{
  background:var(--warn-bg);
  border-left-color:var(--warn-border);
}

/* 代码 */
code{
  background:var(--code-bg);
  padding:.16em .42em;
  border-radius:4px;
  font-size:.88em;
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  word-break:break-word;
}
pre{
  background:var(--code-bg);padding:16px 18px;border-radius:8px;
  overflow-x:auto;border:1px solid var(--border);margin:18px 0;
}
pre code{background:none;padding:0;font-size:13px;line-height:1.65}

/* 表格 */
table{
  border-collapse:collapse;width:100%;margin:20px 0;
  font-size:14.5px;display:block;overflow-x:auto;
  border:1px solid var(--border);border-radius:8px;
}
thead{background:var(--bg-side)}
th,td{
  border-bottom:1px solid var(--border);
  border-right:1px solid var(--border);
  padding:9px 13px;text-align:left;vertical-align:top;
}
th{font-weight:700;white-space:nowrap;font-size:14px}
th:last-child,td:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbfc}
td code{font-size:.86em}

/* 图片 */
img{
  max-width:100%;height:auto;display:block;
  margin:26px auto 10px;
  border:1px solid var(--border-strong);
  border-radius:10px;
  box-shadow:0 2px 12px rgba(0,0,0,.07);
}
/* 图片下的说明段（*图 N：…*） */
p > em:only-child{
  display:block;text-align:center;
  color:var(--fg-muted);font-size:13.5px;line-height:1.6;
  margin:-2px auto 24px;
}

/* 返回顶部 */
#totop{
  position:fixed;right:26px;bottom:26px;
  width:42px;height:42px;border-radius:50%;
  background:var(--accent);color:#fff;border:0;
  font-size:18px;cursor:pointer;display:none;
  box-shadow:0 4px 14px rgba(79,70,229,.36);
  z-index:30;
}
#totop:hover{background:#4338ca}

/* 移动端 */
#navtoggle{
  display:none;position:fixed;top:12px;left:12px;z-index:40;
  background:var(--accent);color:#fff;border:0;border-radius:8px;
  padding:9px 14px;font-size:14px;cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.2);
}
@media (max-width:900px){
  #navtoggle{display:block}
  #sidebar{transform:translateX(-100%);transition:transform .22s ease;z-index:35;box-shadow:0 0 26px rgba(0,0,0,.16)}
  #sidebar.open{transform:none}
  #content{margin-left:0;padding:64px 20px 100px}
  #content > *{max-width:100%}
  h1{font-size:25px}
  h2{font-size:20px}
  body{font-size:15.5px}
}

/* 打印 */
@media print{
  #sidebar,#navtoggle,#totop{display:none}
  #content{margin:0;padding:0;max-width:100%}
  #content > *{max-width:100%}
  img{box-shadow:none;page-break-inside:avoid}
  h1,h2{page-break-after:avoid}
}
</style>
</head>
<body>

<button id="navtoggle" aria-label="目录">☰ 目录</button>

<aside id="sidebar">
  <div class="brand">
    <b>伴伴 · 使用手册</b>
    <span>基于 v2.6.0 · 单页离线版</span>
  </div>
  <!--TOC-->
</aside>

<main id="content"><!--CONTENT--></main>

<button id="totop" aria-label="回到顶部">↑</button>

<script>
// 正文已由构建脚本写进 main，这里只做滚动高亮、目录开关和回到顶部。
(function(){
  var sidebar = document.getElementById('sidebar');
  var main = document.getElementById('content');

  // 滚动高亮
  var links = {};
  Array.prototype.forEach.call(sidebar.querySelectorAll('a[href^="#"]'), function(a){
    links[decodeURIComponent(a.getAttribute('href').slice(1))] = a;
  });
  var heads = Array.prototype.slice.call(main.querySelectorAll('h1[id],h2[id]'));
  var active = null;
  function sync(){
    var y = window.scrollY + 90;
    var current = null;
    for (var i = 0; i < heads.length; i++){
      if (heads[i].offsetTop <= y) current = heads[i]; else break;
    }
    var a = current ? links[current.id] : null;
    if (a !== active){
      if (active) active.classList.remove('active');
      if (a){ a.classList.add('active'); }
      active = a;
      if (a && sidebar.scrollHeight > sidebar.clientHeight){
        var r = a.getBoundingClientRect(), sr = sidebar.getBoundingClientRect();
        if (r.top < sr.top + 40 || r.bottom > sr.bottom - 40){
          sidebar.scrollTop += r.top - sr.top - sidebar.clientHeight / 2.6;
        }
      }
    }
    document.getElementById('totop').style.display = window.scrollY > 700 ? 'block' : 'none';
  }
  var ticking = false;
  window.addEventListener('scroll', function(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){ tick(); });
  }, {passive:true});
  function tick(){ sync(); ticking = false; }

  document.getElementById('totop').addEventListener('click', function(){
    window.scrollTo({top:0, behavior:'smooth'});
  });
  document.getElementById('navtoggle').addEventListener('click', function(){
    sidebar.classList.toggle('open');
  });
  sidebar.addEventListener('click', function(e){
    if (e.target.tagName === 'A' && window.innerWidth <= 900){
      sidebar.classList.remove('open');
    }
  });
  sync();
})();
</script>
</body>
</html>
